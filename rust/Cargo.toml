[package]
name = "urban_recreation_rust"
version = "0.1.0"
edition = "2021"
autobins = false

[features]
default = []
legacy-advisor = ["dep:actix-web", "dep:actix-cors"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.144", features = ["derive"] }
simd-json = { version = "0.6.0", features = ["allow-non-simd"] }
lazy_static = "1.4.0"
serde_repr = "0.1.9"
chrono = "0.4.22"
rand = "0.8.5"
itertools = "0.10.3"
colored = "2.0.0"
regex = "1.6.0"
nohash-hasher = "0.2.0"
rayon = "1.5.3"
tinyvec = { version = "1.6.0", features = ["serde"] }
actix-web = { version = "4.2.1", optional = true }
actix-cors = { version = "0.6.2", optional = true }
serde_json = "1.0.134"

[profile.release]
debug = true

[[bin]]
name = "urban-recreation-legacy"
path = "src/bin/legacy_advisor.rs"
required-features = ["legacy-advisor"]

[[bin]]
name = "urban-recreation-advisor"
path = "src/bin/advisor.rs"
